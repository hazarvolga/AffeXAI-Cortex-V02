name: Deploy to Production

on:
  # Production delivery remains manual until the module acceptance matrix is green.
  # This prevents a repository bootstrap or routine main-branch push from
  # publishing incomplete images or calling configured Coolify webhooks.
  workflow_dispatch:

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  HUSKY: '0'
  NODE_OPTIONS: --max-old-space-size=4096
  DOCKER_REGISTRY: ghcr.io

jobs:
  # ================================================================
  # JOB 1: PRE-BUILD VALIDATION
  # ================================================================
  validate:
    name: Pre-Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for migration checks

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Install shared build dependencies
        run: pnpm --filter @affexai/shared-types install --frozen-lockfile
      - name: Build Shared Types
        run: pnpm build:shared
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile

      - name: Lint Check (Backend, read-only)
        run: pnpm --filter affexai-backend exec eslint "{src,apps,libs,test}/**/*.ts"
      - name: Lint Check (Frontend)
        run: pnpm --filter nextn exec eslint .
      - name: TypeScript Check (Backend)
        run: pnpm --filter affexai-backend typecheck
      - name: TypeScript Check (Frontend)
        run: pnpm --filter nextn typecheck
      - name: Security Audit (fail closed)
        run: pnpm audit --prod --audit-level moderate

  # ================================================================
  # JOB 2: BUILD & TEST
  # ================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: affexai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Install shared build dependencies
        run: pnpm --filter @affexai/shared-types install --frozen-lockfile
      - name: Build Shared Types
        run: pnpm build:shared
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile

      - name: Build Backend
        run: pnpm build:backend

      - name: Build Frontend
        run: pnpm build:frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:9006
          NEXT_PUBLIC_SOCKET_URL: http://127.0.0.1:9006
          NEXT_PUBLIC_APP_URL: http://localhost:9003

      - name: Run Backend Tests
        run: pnpm --filter affexai-backend test:cov --runInBand
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: affexai_test
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-only-test-secret-not-for-any-deployed-environment
          NODE_ENV: test

      - name: Targeted frontend transport, email and editor contracts (not E2E)
        env:
          TSX_TSCONFIG_PATH: ../frontend/tsconfig.json
        run: >-
          pnpm --filter affexai-backend exec tsx --test
          ../frontend/src/components/admin/email-marketing/bulk-contracts.test.ts
          ../frontend/src/emails/email-render-contracts.test.ts
          ../frontend/src/components/__tests__/editor-log-regressions.test.mjs

  # ================================================================
  # JOB 3: DOCKER BUILD
  # ================================================================
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [backend, frontend]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize OCI image prefix
        id: image
        shell: bash
        run: echo "prefix=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ steps.image.outputs.prefix }}-${{ matrix.service }}
          tags: |
            type=sha,prefix={{branch}}-,format=long
            type=raw,value=${{ github.sha }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ steps.image.outputs.prefix }}-${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ steps.image.outputs.prefix }}-${{ matrix.service }}:buildcache,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SOCKET_URL=${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}

  # ================================================================
  # JOB 4: DEPLOY TO COOLIFY
  # ================================================================
  deploy-coolify:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 15

    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      url: ${{ secrets.APP_URL }}

    steps:
      - name: Trigger Coolify Deployment (Backend)
        run: |
          IMAGE_PREFIX="${GITHUB_REPOSITORY,,}"
          curl -X POST "${{ secrets.COOLIFY_WEBHOOK_BACKEND }}" \
            -H "Content-Type: application/json" \
            -d '{
              "image": "${{ env.DOCKER_REGISTRY }}/'"$IMAGE_PREFIX"'-backend:${{ github.sha }}",
              "tag": "${{ github.ref_name }}-${{ github.sha }}"
            }'

      - name: Trigger Coolify Deployment (Frontend)
        run: |
          IMAGE_PREFIX="${GITHUB_REPOSITORY,,}"
          curl -X POST "${{ secrets.COOLIFY_WEBHOOK_FRONTEND }}" \
            -H "Content-Type: application/json" \
            -d '{
              "image": "${{ env.DOCKER_REGISTRY }}/'"$IMAGE_PREFIX"'-frontend:${{ github.sha }}",
              "tag": "${{ github.ref_name }}-${{ github.sha }}"
            }'

      - name: Wait for Deployment
        run: sleep 60  # Wait for containers to start

      - name: Health Check - Backend
        run: |
          MAX_RETRIES=10
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -f -s "${{ secrets.BACKEND_URL }}/api/health" > /dev/null; then
              echo "✅ Backend health check passed"
              exit 0
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "⏳ Waiting for backend... ($RETRY_COUNT/$MAX_RETRIES)"
            sleep 10
          done

          echo "❌ Backend health check failed"
          exit 1

      - name: Health Check - Frontend
        run: |
          MAX_RETRIES=10
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -f -s "${{ secrets.FRONTEND_URL }}" > /dev/null; then
              echo "✅ Frontend health check passed"
              exit 0
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "⏳ Waiting for frontend... ($RETRY_COUNT/$MAX_RETRIES)"
            sleep 10
          done

          echo "❌ Frontend health check failed"
          exit 1

  # ================================================================
  # JOB 5: POST-DEPLOYMENT VALIDATION
  # ================================================================
  post-deploy:
    name: Post-Deployment Validation
    runs-on: ubuntu-latest
    needs: deploy-coolify
    timeout-minutes: 10

    steps:
      - name: Smoke Tests
        run: |
          echo "🧪 Running smoke tests..."

          # Test backend API
          curl -f "${{ secrets.BACKEND_URL }}/api/settings" || {
            echo "⚠️ Settings endpoint failed (may require auth)"
          }

          # Test frontend homepage
          curl -f "${{ secrets.FRONTEND_URL }}" || exit 1

          echo "✅ Smoke tests passed"

      - name: Send Slack Notification
        if: always()
        run: |
          WEBHOOK="${{ secrets.SLACK_WEBHOOK }}"

          if [ -z "$WEBHOOK" ]; then
            echo "⚠️ SLACK_WEBHOOK not configured, skipping notification"
            exit 0
          fi

          STATUS="${{ job.status }}"
          COLOR="good"

          if [ "$STATUS" == "failure" ]; then
            COLOR="danger"
          elif [ "$STATUS" == "cancelled" ]; then
            COLOR="warning"
          fi

          curl -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"🚀 Deployment $STATUS\",
              \"attachments\": [{
                \"color\": \"$COLOR\",
                \"fields\": [
                  {\"title\": \"Status\", \"value\": \"$STATUS\", \"short\": true},
                  {\"title\": \"Environment\", \"value\": \"${{ github.ref_name }}\", \"short\": true},
                  {\"title\": \"Commit\", \"value\": \"${{ github.sha }}\", \"short\": true},
                  {\"title\": \"Author\", \"value\": \"${{ github.actor }}\", \"short\": true}
                ]
              }]
            }"

      - name: Update Deployment Log
        run: |
          echo "📝 Deployment completed at $(date)"
          echo "Commit: ${{ github.sha }}"
          echo "Environment: ${{ github.ref_name }}"
          echo "Status: ${{ job.status }}"
